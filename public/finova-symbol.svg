<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="100%" height="100%">
  <!-- FINOVA Master Geometric "Ascendant F" Symbol -->
  <defs>
    <!-- Dynamic Growth Gradient -->
    <linearGradient id="finova-growth-grad" x1="18.5" y1="15.5" x2="39.5" y2="6.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#588D52" />
      <stop offset="60%" stop-color="#659B5E" />
      <stop offset="100%" stop-color="#76BA6F" />
    </linearGradient>

    <!-- Tactile Pillar Gradient -->
    <linearGradient id="finova-pillar-grad" x1="9" y1="15.5" x2="9" y2="40.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A6F42" />
      <stop offset="100%" stop-color="#355230" />
    </linearGradient>
  </defs>

  <!-- 1. Bedrock Pillar (Foundation & Solvency) -->
  <path
    d="M 9 15.5 V 40.5"
    stroke="url(#finova-pillar-grad)"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!-- 2. Middle Horizon-to-Ascent Vector (Smart Management & Compounding) -->
  <path
    d="M 18.5 27.5 H 25.5 L 33.5 19.5"
    stroke="#659B5E"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 3. Upper Sovereign Growth Wing (High Expansion & Long-term Opportunity) -->
  <path
    d="M 18.5 15.5 H 30.5 L 39.5 6.5"
    stroke="url(#finova-growth-grad)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
