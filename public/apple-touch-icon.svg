<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none" width="100%" height="100%">
  <!-- FINOVA Mobile App Icon (180x180 iOS Squircle) -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="app-bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Top Wing Gradient -->
    <linearGradient id="app-growth-grad" x1="18.5" y1="15.5" x2="39.5" y2="6.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#55874E" />
      <stop offset="50%" stop-color="#659B5E" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="app-icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#659B5E" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- iOS Squircle Container in Deep Navy (#1E293B) -->
  <rect width="180" height="180" rx="42" fill="url(#app-bg)" />
  <rect x="1.5" y="1.5" width="177" height="177" rx="40.5" stroke="#334155" stroke-width="1.5" />

  <!-- Centered Ascendant 'F' Symbol (Scale 2.7x, Centered) -->
  <g transform="translate(25, 25) scale(2.7)" filter="url(#app-icon-glow)">
    <!-- Bedrock Pillar in Crisp White -->
    <path
      d="M 9 15.5 V 40.5"
      stroke="#FFFFFF"
      stroke-width="7"
      stroke-linecap="round"
    />

    <!-- Middle Horizon-to-Ascent Vector in Primary Green -->
    <path
      d="M 18.5 27.5 H 25.5 L 33.5 19.5"
      stroke="#659B5E"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Upper Sovereign Growth Wing with Mint Highlight -->
    <path
      d="M 18.5 15.5 H 30.5 L 39.5 6.5"
      stroke="url(#app-growth-grad)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
