<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 48" fill="none" width="100%" height="100%">
  <!-- FINOVA Official Brand Logo for Dark Surfaces -->
  <defs>
    <linearGradient id="logo-dark-growth-grad" x1="18.5" y1="15.5" x2="39.5" y2="6.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#588D52" />
      <stop offset="60%" stop-color="#659B5E" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>
  </defs>

  <!-- Symbol Left -->
  <g transform="translate(0, 0)">
    <!-- Bedrock Pillar in Crisp White -->
    <path
      d="M 9 15.5 V 40.5"
      stroke="#FFFFFF"
      stroke-width="7"
      stroke-linecap="round"
    />

    <!-- Middle Horizon-to-Ascent Vector in Primary Green -->
    <path
      d="M 18.5 27.5 H 25.5 L 33.5 19.5"
      stroke="#659B5E"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Upper Sovereign Growth Wing with Mint Highlight -->
    <path
      d="M 18.5 15.5 H 30.5 L 39.5 6.5"
      stroke="url(#logo-dark-growth-grad)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Geometric Wordmark FINOVA in Crisp White -->
  <text
    x="56"
    y="33.5"
    fill="#FFFFFF"
    font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="800"
    font-size="24"
    letter-spacing="0.22em"
  >FINOVA</text>
</svg>
